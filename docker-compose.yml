services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-moneymaker_prod}
      POSTGRES_USER: ${DATABASE_USER:-moneymaker_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ljZccQ+Y5DRBr4ljJnXqBdNatdX3BvwPSqaZbZ0tAjs=}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - moneymaker-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-moneymaker_user} -d ${DATABASE_NAME:-moneymaker_prod}',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - moneymaker-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # ChromaDB para Vector Store (IA)
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - '${CHROMADB_PORT:-8000}:8000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - moneymaker-network
    environment:
      IS_PERSISTENT: 'TRUE'
      ANONYMIZED_TELEMETRY: 'FALSE'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/heartbeat']
      interval: 30s
      timeout: 10s
      retries: 5

  # Ollama para LLM Local (IA) - OPCIONAL
  # Descomente se quiser rodar localmente (requer recursos significativos)
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - '${OLLAMA_PORT:-11434}:11434'
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - moneymaker-network
  #   # Descomente para usar GPU (NVIDIA)
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - moneymaker-network

  # Aplicação NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-30d}
      DATABASE_URL: postgresql://${DATABASE_USER:-moneymaker_user}:${DATABASE_PASSWORD:-ljZccQ+Y5DRBr4ljJnXqBdNatdX3BvwPSqaZbZ0tAjs=}@postgres:5432/${DATABASE_NAME:-moneymaker_prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Variáveis para Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8393105211:AAE7_e8KG5cgoe0FZgz6RlGppDefLKopBlg}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-7201413321}
      TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-30000}
      TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT:-15000}
      TELEGRAM_READ_TIMEOUT: ${TELEGRAM_READ_TIMEOUT:-30000}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES:-3}
      TELEGRAM_RETRY_DELAY: ${TELEGRAM_RETRY_DELAY:-2000}
      # Variáveis para Prometheus (caso precise)
      PROMETHEUS_METRICS_PORT: 9091
      # Variáveis para IA
      CHROMADB_URL: ${CHROMADB_URL:-http://chromadb:8000}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    # Volumes removidos para produção - o build multi-stage já inclui tudo necessário
    # Para desenvolvimento, descomente as linhas abaixo:
    # volumes:
    #   - .:/usr/src/app
    #   - /usr/src/app/node_modules
    networks:
      - moneymaker-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      # Descomente se habilitar o Ollama
      # ollama:
      #   condition: service_started

  # Serviço de Backup Automático
  backup:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD:-ljZccQ+Y5DRBr4ljJnXqBdNatdX3BvwPSqaZbZ0tAjs=}
      POSTGRES_DB: ${DATABASE_NAME:-moneymaker_prod}
      POSTGRES_USER: ${DATABASE_USER:-moneymaker_user}
      POSTGRES_HOST: postgres
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    command: >
      sh -c "
        if [ \"$$BACKUP_ENABLED\" = \"true\" ] && [ \"$$NODE_ENV\" = \"production\" ]; then
          echo '🔄 Backup habilitado para produção';
          echo '⏰ Aguardando 2 horas para primeiro backup...';
          sleep 7200;  # 2 horas
          /scripts/backup.sh;
          while true; do
            sleep 86400;
            /scripts/backup.sh;
          done;
        else
          echo '🚫 Backup desabilitado ou não é produção';
          sleep infinity;
        fi;
      "
    restart: unless-stopped
    networks:
      - moneymaker-network

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  # Descomente se habilitar o Ollama
  # ollama_data:

networks:
  moneymaker-network:
    driver: bridge
